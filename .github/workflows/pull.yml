name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  static-analysis:
    name: Static Analysis
    uses: ./.github/workflows/ci_static-analysis.yaml
  tests:
    name: Run Tests
    uses: ./.github/workflows/ci_tests.yaml
    with:
      platforms: '[{"os": "ubuntu-latest", "architecture": "x64"}]'
  tests-macos-windows:
    name: Run Tests (macOS, Windows)
    uses: ./.github/workflows/ci_tests.yaml
    with:
      platforms: '[{"os": "windows-latest", "architecture": "x64"}, {"os": "macos-14"}]'
  install-tests:
    name: Installation Tests
    uses: ./.github/workflows/install.yaml
    with:
      platforms: '[{"os": "ubuntu-latest", "architecture": "x64"}]'
  install-tests-macos-windows:
    name: Installation Tests (macOS, Windows)
    uses: ./.github/workflows/install.yaml
    with:
      platforms: '[{"os": "windows-latest", "architecture": "x64"}, {"os": "macos-latest", "architecture": "x64"}]'
  integration-tests:
    name: Integ Tests
    uses: ./.github/workflows/python-integration.yml
  examples:
    name: Example Tests
    uses: ./.github/workflows/python-examples.yml
  pr-ci-all-required:
    if: always()
    needs:
      - tests
      - static-analysis
      - install-tests
    runs-on: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-cli-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
