# This workflow runs installation tests.
name: venv-tests

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: >-
          [{"os": "ubuntu-latest", "architecture": "x64", "runner": "codebuild-CryptoToolsCI-linux-aws-encryption-sdk-cli-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "windows-latest", "architecture": "x64", "runner": "windows-latest"},
           {"os": "macos-latest", "architecture": "x64", "runner": "macos-latest"}]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        python:
          - "3.12"
        category:
          - local
# These require credentials.
# Enable them once we sort how to provide them.
#          - integ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
      - name: MacOS and Linux setup venv and package
        run: |
          python -m pip install --upgrade pip    
          python -m venv env
          source env/bin/activate
          python -m pip install aws-encryption-sdk-cli
        if: matrix.platform.os != 'windows-latest'
      - name: Windows setup venv and package
        run: |
          python -m pip install --upgrade pip    
          python -m venv env
          .\env\Scripts\activate
          python -m pip install aws-encryption-sdk-cli
        if: matrix.platform.os == 'windows-latest'
      - name: Windows run test
        run: |
          .\env\Scripts\activate
          (Get-Command python).Path
          aws-encryption-cli --version
        if: matrix.platform.os == 'windows-latest'
      - name: MacOS Linux run test
        run: |
          source env/bin/activate
          aws-encryption-cli --version
        if: matrix.platform.os != 'windows-latest'
