# This workflow runs tests.
name: tests

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: >-
          [{"os": "ubuntu-latest", "architecture": "x64", "runner": "codebuild-CryptoToolsCI-linux-aws-encryption-sdk-cli-${{ github.run_id }}-${{ github.run_attempt }}"},
           {"os": "windows-latest", "architecture": "x64", "runner": "windows-latest"},
           {"os": "macos-14", "runner": "macos-14"}]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        python:
          - "3.10"
          - "3.11"
          - "3.12"
        category:
          - local
# These require credentials.
# Enable them once we sort how to provide them.
#          - integ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.architecture }}
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r dev_requirements/ci-requirements.txt
      - name: run test
        env:
          TOXENV: ${{ matrix.category }}
        run: tox -- -vv
